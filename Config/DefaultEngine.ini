RenderFocusRule=Never

; Perf lane 2026-11-18 (coordinator-approved): bundled PSO cache. PSO precaching alone missed 87 pipelines in a cooked
; playthrough (186 ms hitch on the title, 152 + 41 ms at the door portal). The cache recorded from cooked runs lives in
; Build/Windows/PipelineCaches/*_FoA_PCD3D_SM6.spc and is compiled at startup. Engine default here was 0 (off).
; Stable shader keys for that cache are switched on by Tools/Perf/pack.sh in the pack mirror only.
[ConsoleVariables]
r.ShaderPipelineCache.Enabled=1
; Perf lane 2026-11-18 (coordinator-approved): dynamic resolution on Low, Medium and High holds 60 fps on slower GPUs.
; These are the fixed parts. BPFL_FoASettings turns it on (r.DynamicRes.OperationMode 2) with
; r.DynamicRes.MaxScreenPercentage = the preset's resolution quality, and off at 100% (Epic). The r.DynamicRes.* cvars are
; not ECVF_Scalability, so DefaultScalability.ini can't set them per preset; with dynamic resolution on, r.ScreenPercentage
; is ignored. The heuristic targets the budget minus 10% headroom, from D3D12 GPU timing.
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.FrameTimeBudget=16.67
