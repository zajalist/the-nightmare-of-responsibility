; Perf lane, 2026-11-18. Targets: 60 fps at 1080p on a GTX 1060 / RX 580 at Medium, a GTX 1650 laptop at Low.
; Measured in standalone game processes (Tools/Perf/perf_run.py, report Saved/QA/lanes/perf.md); High and Epic unchanged.
;
; Auto-detect calibration, for GameUserSettings.RunHardwareBenchmark + ApplyHardwareBenchmarkResults. The engine's
; thresholds (18 42 115) put any GPU since ~2016 on Epic: in the Shipping game this RTX 5070 scores GPUIndex 730 to 746.
; Every group uses the GPU index and the same cut points, so a detected preset is a
; whole preset, like the Settings menu's Quality row: under 250 Low (GTX 1650 laptop, GTX 1060, RX 580), 250 to 340 Medium
; (GTX 1070, GTX 1660, RTX 2060 to RTX 3060), 340 to 840 High (RTX 3070 to RTX 5070), 840 and up Epic (RTX 4080 and up).
; Low/Medium cut 90 -> 160 (11-18 14:45, coordinator-approved): the index is a weighted mean of five tests (engine
; GPUBenchmark.cpp: fill x3, ALU x1, bandwidth x1, two texture tests x0.1); scaling this 5070's measured tests by
; hardware ratios puts a GTX 1650 laptop at about 125 to 150, a GTX 1060 / RX 580 at about 170 to 240, a GTX 1070 / RTX 2060 at
; about 260 to 325. Low/Medium 160 -> 250 (11-18 15:15, coordinator's rule: a 1060 gets the preset closest to 60 fps in the
; fight). Published 3DMark Time Spy Graphics puts a GTX 1060 5.3 to 5.5x below this 5070: its fight is about 19 ms at Low
; and 24 to 26 ms at Medium, so Low; a GTX 1070 class (about 3.7x) holds 60 at Medium with dynamic resolution.
; Epic was 560 until 11-18 05:00 (coordinator-approved): cooked Epic on this RTX 5070 ran the fight and door portal at
; 16 to 17 ms frames, so 5070-class cards start on High (about 8 ms) and Epic stays a choice. Recalibrated 11-18 13:00:
; the Shipping game's own first-boot benchmark (RunHardwareBenchmark 10,1,1) scores this 5070 at 746, 1.2x the editor-binary
; 622 these cuts were first set from, so all three cuts were scaled by 1.2: 75 280 700 -> 90 340 840 (the 5070 then
; lands on High with a 12% margin).
; Medium renders at 60% (was 71%) and TSR upscales: 6 to 22% less GPU time per moment, the largest single gain. 55% was tried
; (11-18 13:20): 0.25 ms off the fight but visibly softer under the head sway (static-crop sharpness -7 to -14%), so not taken.
[ScalabilitySettings]
PerfIndexThresholds_ResolutionQuality="GPU 250 340 840"
PerfIndexThresholds_ViewDistanceQuality="GPU 250 340 840"
PerfIndexThresholds_AntiAliasingQuality="GPU 250 340 840"
PerfIndexThresholds_ShadowQuality="GPU 250 340 840"
PerfIndexThresholds_GlobalIlluminationQuality="GPU 250 340 840"
PerfIndexThresholds_ReflectionQuality="GPU 250 340 840"
PerfIndexThresholds_PostProcessQuality="GPU 250 340 840"
PerfIndexThresholds_TextureQuality="GPU 250 340 840"
PerfIndexThresholds_EffectsQuality="GPU 250 340 840"
PerfIndexThresholds_FoliageQuality="GPU 250 340 840"
PerfIndexThresholds_ShadingQuality="GPU 250 340 840"
PerfIndexValues_ResolutionQuality="50 60 87 100 100"

; Medium's virtual-shadow soft-shadow rays 4 -> 2 (Low below too): softer penumbras get slightly noisier, TSR smooths.
; Fight trim 11-18 13:10 (Low and Medium): local-light shadow pages one level coarser and one sample per ray.
[ShadowQuality@1]
r.Shadow.Virtual.SMRT.RayCountDirectional=2
r.Shadow.Virtual.SMRT.RayCountLocal=2
r.Shadow.Virtual.ResolutionLodBiasLocal=2
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=1

; Fight trim 11-18 13:10 (Medium): Lumen's surface cache relights half as often (direct lighting and radiosity).
[GlobalIlluminationQuality@1]
r.LumenScene.DirectLighting.UpdateFactor=256
r.LumenScene.Radiosity.UpdateFactor=256

; Texture streaming pool per texture-quality level. Engine defaults (400/600/800/1000 MB) ran over budget with
; ~780 MB of loaded textures. LimitPoolSizeToVRAM keeps small GPUs safe.
[TextureQuality@1]
r.Streaming.PoolSize=900
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@2]
r.Streaming.PoolSize=1200
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=1500
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@Cine]
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1

; Low keeps shadows (world lane, 2026-11-10, coordinator-approved). With ShadowQuality@0's r.ShadowQuality=0 the moon and
; lamps lit everything unoccluded and Low read bright and flat (T3 0.147 -> 0.647); these are ShadowQuality@1's values.
; The rest of Low stays the engine's @0 (GI none, reflections, post, effects, shading, AA, view distance, 50% resolution).
[ShadowQuality@0]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.05
r.Shadow.DistanceScale=0.7
r.Shadow.CSM.TransitionScale=0.25
r.CapsuleShadows=1
; perf lane 2026-11-18: 4 -> 2 rays and the 13:10 fight trim, as Medium
r.Shadow.Virtual.SMRT.RayCountDirectional=2
r.Shadow.Virtual.SMRT.RayCountLocal=2
r.Shadow.Virtual.ResolutionLodBiasLocal=2
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=1
