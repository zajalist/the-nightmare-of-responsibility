[/Script/HaybaMCPToolkit.HaybaMCPDeveloperSettings]
; About 15 lanes each keep an MCP connection open, plus hayba_call.py / editor_lock.py; the default of 16 rejected
; reconnecting MCP clients ("Hayba MCP disconnected"). Read when the editor starts.
TcpMaxClientConnections=64
; Lanes coordinate through editor_lock.py leases (owner = lane); their MCP servers run under per-process owners, so
; Hayba's newer EnforcedForWrites default would refuse their tool calls. Keep conflicts as warnings until every lane's
; MCP server starts with HAYBA_AGENT_ID=<lane>.
LeaseEnforcement=Advisory
; Lets ue_remote.py run Tools/ scripts through Hayba's guarded python_exec_file (from the next Hayba DLL on).
bAllowProjectPythonFiles=True
; Folders asset_import may read glTF/GLB (and their buffers/textures) from. Settings only; tool calls can't widen it.
+TrustedImportRoots=P:/FoA-Assets
